<div class="login-container">
  <div class="left-panel">
    <div class="logo-section">
      <div class="logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2"/>
          <path d="M15 18C15 18 17 15 20 15C23 15 25 18 25 18" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <ellipse cx="16" cy="22" rx="3" ry="4" fill="white"/>
          <ellipse cx="24" cy="22" rx="3" ry="4" fill="white"/>
          <path d="M13 25C13 25 15 28 20 28C25 28 27 25 27 25" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <div class="logo-text">
          <h1>Davita</h1>
          <p>Patient Support System</p>
        </div>
      </div>
    </div>

    <div class="tagline">
      <h2>Better Care.<br/>Stronger <span class="highlight">Together.</span></h2>
      <p>A smart platform to monitor, support and<br/>improve the lives of kidney care patients.</p>
    </div>

    <div class="illustration">
      <div class="icon icon-clipboard">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4A90E2" stroke-width="2">
          <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
      </div>
      <div class="icon icon-shield">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4A90E2" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div class="icon icon-heart">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="#E74C3C" stroke="#C0392B" stroke-width="2">
          <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
        </svg>
      </div>
      <div class="icon icon-users">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4A90E2" stroke-width="2">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 00-3-3.87"/>
          <path d="M16 3.13a4 4 0 010 7.75"/>
        </svg>
      </div>
      <div class="icon icon-user">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4A90E2" stroke-width="2">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      
      <div class="kidneys">
        <div class="kidney kidney-left"></div>
        <div class="kidney kidney-right"></div>
        <div class="hands"></div>
      </div>
    </div>
  </div>

  <div class="right-panel">
    <div class="login-form-container">
      <h2>Welcome Back</h2>
      <p class="subtitle">Please sign in to continue to your account</p>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input 
              type="text" 
              id="username" 
              name="username"
              [(ngModel)]="username"
              placeholder="Enter your username"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              id="password" 
              name="password"
              [(ngModel)]="password"
              placeholder="Enter your password"
              required
            />
            <button 
              type="button" 
              class="toggle-password"
              (click)="togglePasswordVisibility()"
            >
              <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input 
              type="checkbox" 
              name="rememberMe"
              [(ngModel)]="rememberMe"
            />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-password">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-signin">Sign In</button>

      </form>

     
    </div>
  </div>
</div>
